name: macOS baseline

on:
  push:
    branches:
      - codex/macos-baseline

permissions:
  contents: read

jobs:
  baseline:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      POETRY_KEYRING_ENABLED: "false"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: User0332/rewards-farmer
          ref: 146dd2f2322b7d44c6883c4d8495000b29d28497
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record native tool versions
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = 146dd2f2322b7d44c6883c4d8495000b29d28497
          python --version
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' '/Applications/Microsoft Edge.app/Contents/Info.plist'
          if command -v msedgedriver >/dev/null 2>&1; then
            msedgedriver --version
          else
            "$EDGEWEBDRIVER/msedgedriver" --version
          fi
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check poetry==2.5.1
          poetry --version
          poetry check --lock
          poetry install --no-interaction --no-ansi
          poetry run python -m pip check
      - name: Check CLI entry points
        run: |
          poetry run python src/main.py --help
          poetry run python src/init-config.py --help
          git diff --exit-code HEAD